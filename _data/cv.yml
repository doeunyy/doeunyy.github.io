- title: Academic Projects
  type: time_table
  contents:
    - title: Multimodal Entrance Detection System
      year: Jan 2026 - Present
      description:
        - Contributed to DoRA-based Qwen fine-tuning for multimodal entrance detection using aerial imagery, street-view images, GPS trajectories, and building footprint overlays.
        - Developed GPS-aware reranking across 64 candidate entrance locations, improving F1 from 0.30 to 0.59 and AUPR from 0.17 to 0.45.
    - title: "PokerBench: SLMs for Poker Decision-Making"
      year: Aug 2025 - Dec 2025
      description:
        - Fine-tuned Qwen3, LLaMA-3.2, and Gemma variants using QLoRA and LoRA adapters on approximately 560K solver-labeled samples.
        - Built an evaluation pipeline for instruction-following under uncertainty and compared model performance against larger proprietary baselines.
    - title: "TalesRunner: AI-powered Storybook Generation from Images"
      year: Jan 2025 - Feb 2025
      description:
        - Developed a multimodal generation pipeline combining BLIP-based image captioning, fine-tuned KoT5 story generation, and GPT-4o-assisted text refinement.
        - Integrated generated captions, story text, and user images into downloadable PDF storybooks, validating narrative quality, image-text alignment, and formatting consistency across 100+ test cases.
    - title: "Jeans: AI-Based Photo Editing and Sharing Service for Seniors"
      year: Dec 2024 - Feb 2025
      description:
        - Led a 5-member team in developing AI features including fine-tuned Whisper for Korean dialect speech recognition and YOLO/FaceNet-based facial recognition.
        - Deployed FastAPI-based ML inference services on AWS EC2 with GitHub Actions CI/CD.

