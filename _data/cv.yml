- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Laboratory for Machine Learning, Health and Biomedicine, University of Southern California
      year: Nov 2025 - Present
      description:
        - "Advisor: Prof. Ruishan Liu"
        - Developed a deimmunization algorithm for synthetic binders, identifying amino acid substitutions in high-immunogenicity peptide regions aimed at reducing predicted immunogenicity while preserving binding affinity.
        - Optimized deimmunization search with peptide-level score caching and beam search, reducing redundant immunogenicity evaluations while retaining multiple promising candidate substitutions for sequence-level optimization.
        - Built a FastAPI- and Gradio-based research interface for HLA-specific peptide scanning and implemented RabbitMQ-based asynchronous job orchestration for concurrent peptide scans.
    - title: Undergraduate Researcher
      institution: AI Computing Platform Lab, Ewha Womans University
      year: Apr 2024 - Feb 2025
      description:
        - "Advisor: Prof. Jaehyeong Sim"
        - Led an undergraduate research team on Layer-Adaptive Quantization of Diffusion Models using Fisher Information to guide layer-wise quantization.
        - Reduced model size by 49.4% and improved FID by 7%; presented the work at the 2024 IEIE Symposium as a co-first author and presenter.
        - Led a DDPM interpretability study using Integrated Gradients, GradSHAP, and Occlusion on ImageNet-1000 and presented the work at the KCC 2024 XAI Workshop.

